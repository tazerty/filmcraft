# Evora : build web (WASM) de filmcraft, moteur d'Evora Corte, et portes de qualité.
#
# Workflow écrit par Evora. Rien n'est copié de storytold/craft-common-actions (non épinglé, sans
# licence). La construction reprend packaging/web/package.sh et `cargo xtask web` (MIT OR
# Apache-2.0). Actions GitHub seules, épinglées par SHA ; outils installés à version exacte
# (`cargo install --locked`) et vérifiés ; aucun secret.
#
# Portes bloquantes (apps/creative/ARCHITECTURE.md §3.4) : marques ArtCraft dans le bundle, fichiers
# d'hébergement dans l'archive, cargo-deny (licences, avis de sécurité, sources), cargo-about
# (LICENSES/ agrégé), test de fumée Chrome sans interface depuis une autre origine. Portes de
# catalogue : émojis (E10) et termes sensibles (E9), en mesure tant que leur patch n'est pas posé
# (EVORA_EMOJI_GATE / EVORA_TERMS_GATE), bloquantes ensuite.
# Sorties : evora-corte-web-<tag>.zip (site, .br/.gz, LICENSES/, csp-hashes.txt), SHA256SUMS,
# csp-hashes.txt. L'artefact au nom Evora n'est publié que si toutes les portes sont vertes.
name: Evora web

on:
  push:
    branches: ["evora/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evora-web-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pas de rust-toolchain(.toml) dans le dépôt : stable épinglée, au moins rust-version (1.95) du
  # Cargo.toml ; 1.99.0 est la version qui a produit la release web officielle 0.7.2.
  RUST_TOOLCHAIN: "1.99.0"
  # Doit être exactement WASM_BINDGEN de xtask/src/main.rs (vérifié plus bas).
  WASM_BINDGEN_VERSION: "0.2.129"
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_ABOUT_VERSION: "0.9.2"
  # report = mesure ; block = porte bloquante (une fois le patch correspondant posé).
  EVORA_EMOJI_GATE: "block"
  EVORA_TERMS_GATE: "block"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  web:
    name: Web (wasm)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag amont et nom de l'archive
        id: meta
        shell: bash
        run: |
          branch="$GITHUB_REF_NAME"
          tag="${branch#evora/}"
          if [[ "$branch" != evora/* || ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::branche inattendue « $branch » (attendu : evora/vX.Y.Z)"
            exit 1
          fi
          version="$(awk '/^\[/ { p = ($0 == "[workspace.package]"); next } p && $1 == "version" { gsub(/[" ]/, "", $3); print $3; exit }' Cargo.toml)"
          if [ "v$version" != "$tag" ]; then
            echo "::error::Cargo.toml annonce $version, la branche vise $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=evora-corte-web-$tag" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      - name: Concordance de wasm-bindgen avec xtask
        shell: bash
        run: |
          want="$(sed -n 's/^const WASM_BINDGEN: &str = "\(.*\)";$/\1/p' xtask/src/main.rs)"
          if [ "$want" != "$WASM_BINDGEN_VERSION" ]; then
            echo "::error::xtask exige wasm-bindgen « $want », le workflow épingle $WASM_BINDGEN_VERSION"
            exit 1
          fi

      - name: Toolchain Rust (rustup)
        shell: bash
        run: |
          rustup --version
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          rustc --version --verbose
          cargo --version
          need="$(awk -F'"' '/^rust-version *=/ { print $2; exit }' Cargo.toml)"
          have="$(rustc --version | awk '{ print $2 }')"
          if [ -z "$need" ] || ! printf '%s\n%s\n' "$need" "$have" | sort -V -C; then
            echo "::error::rustc $have ne satisfait pas rust-version « $need »"
            exit 1
          fi

      - name: Cache du registre cargo (lecture)
        id: registry
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: evora-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            evora-cargo-${{ runner.os }}-

      - name: Cache des outils épinglés (lecture)
        id: tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.evora-tools
          key: evora-tools-${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-wb-${{ env.WASM_BINDGEN_VERSION }}-deny-${{ env.CARGO_DENY_VERSION }}-about-${{ env.CARGO_ABOUT_VERSION }}

      - name: Outils épinglés (wasm-bindgen-cli, cargo-deny, cargo-about)
        shell: bash
        run: |
          tools="$HOME/.evora-tools"
          install() { # crate version binaire [options cargo install…]
            local crate="$1" version="$2" bin="$3"
            shift 3
            if [ ! -x "$tools/bin/$bin" ]; then
              cargo install "$crate" --version "=$version" --locked --root "$tools" "$@"
            fi
          }
          install wasm-bindgen-cli "$WASM_BINDGEN_VERSION" wasm-bindgen
          install cargo-deny "$CARGO_DENY_VERSION" cargo-deny
          install cargo-about "$CARGO_ABOUT_VERSION" cargo-about --features cli
          check() { # binaire sortie-attendue
            local got
            got="$("$tools/bin/$1" --version)"
            echo "$got"
            if [ "$got" != "$2" ]; then
              echo "::error::$1 inattendu : « $got » (attendu « $2 »)"
              exit 1
            fi
          }
          check wasm-bindgen "wasm-bindgen $WASM_BINDGEN_VERSION"
          check cargo-deny "cargo-deny $CARGO_DENY_VERSION"
          check cargo-about "cargo-about $CARGO_ABOUT_VERSION"
          echo "$tools/bin" >> "$GITHUB_PATH"

      - name: Cache des outils épinglés (écriture)
        if: steps.tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.evora-tools
          key: ${{ steps.tools.outputs.cache-primary-key }}

      - name: Dépendances (cargo fetch)
        shell: bash
        run: cargo fetch --locked

      - name: Cache du registre cargo (écriture)
        if: steps.registry.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ steps.registry.outputs.cache-primary-key }}

      - name: Porte cargo-deny (licences, avis de sécurité, sources)
        id: deny
        shell: bash
        run: |
          rc=0
          cargo deny --manifest-path apps/filmcraft-web/Cargo.toml --config .github/evora/deny.toml --locked --color never \
            check advisories licenses sources > "$RUNNER_TEMP/deny.log" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/deny.log"
          {
            echo "### Porte cargo-deny (bloquante)"
            echo
            echo "Graphe : crate \`filmcraft-web\`, cible \`wasm32-unknown-unknown\`, sans dépendances de dev. $(cargo deny --version)."
            echo
            echo '```'
            { grep -E '(advisories|licenses|sources) (ok|FAILED)|^(warning|error)\[' "$RUNNER_TEMP/deny.log" || true; } | sort | uniq -c | sort -rn | head -40
            echo '```'
            echo
            echo "Code de sortie : $rc"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Porte E7 (graphe livré sans client réseau ni moteur d'inférence)
        shell: bash
        run: |
          cargo tree --locked -p filmcraft-web --target wasm32-unknown-unknown -e normal --prefix none --format '{p}' \
            | awk '{ print $1 }' | sort -u > "$RUNNER_TEMP/web-crates.txt"
          n="$(wc -l < "$RUNNER_TEMP/web-crates.txt")"
          bad="$(grep -E -x 'ureq|reqwest|hyper|hyper-util|h2|rustls|rustls-rustcrypto|native-tls|openssl|candle-core|candle-nn|candle-transformers' "$RUNNER_TEMP/web-crates.txt" | tr '\n' ' ' || true)"
          echo "crates du graphe web : $n ; interdites : ${bad:-aucune}"
          {
            echo "### Porte E7 : graphe livré sans client réseau ni moteur d'inférence (bloquante)"
            echo
            echo "$n crates dans le graphe de \`filmcraft-web\` (wasm32, dépendances normales). Interdites (client HTTP ou TLS, inférence Whisper/Kokoro : features whisper, speech-download, neural-voices) : ${bad:-aucune}."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$n" -lt 50 ]; then
            echo "::error::graphe web anormalement petit ($n crates) : la porte ne mesure rien"
            exit 1
          fi
          if [ -n "$bad" ]; then
            echo "::error::crates interdites dans le graphe web : $bad"
            exit 1
          fi

      - name: Licences tierces (cargo-about)
        id: about
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/licences"
          cargo about generate --manifest-path apps/filmcraft-web/Cargo.toml --config .github/evora/about.toml \
            --locked --fail --output-file "$RUNNER_TEMP/licences/THIRD-PARTY-LICENSES.html" .github/evora/about.hbs
          n="$(grep -c '<h3 id=' "$RUNNER_TEMP/licences/THIRD-PARTY-LICENSES.html" || true)"
          c="$(grep -c '<li>' "$RUNNER_TEMP/licences/THIRD-PARTY-LICENSES.html" || true)"
          echo "THIRD-PARTY-LICENSES.html : $(stat -c %s "$RUNNER_TEMP/licences/THIRD-PARTY-LICENSES.html") octets, $n textes de licence"
          if [ "${n:-0}" -lt 1 ]; then
            echo "::error::cargo-about n'a produit aucun texte de licence"
            exit 1
          fi
          {
            echo "### Licences tierces (cargo-about)"
            echo
            echo "\`LICENSES/THIRD-PARTY-LICENSES.html\` : $n textes de licence, $c entrées. $(cargo about --version)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build web (cargo xtask web)
        id: build
        shell: bash
        run: |
          # xtask applique wasm-opt s'il le trouve sur le PATH : le signaler, il n'est pas épinglé ici.
          if command -v wasm-opt >/dev/null; then
            echo "::warning::wasm-opt présent sur le runner ($(wasm-opt --version)), appliqué par xtask"
          fi
          unset CRAFT_FONTS_DIR CRAFT_FONTS_REQUIRED
          command -v wasm-bindgen
          cargo xtask web

      - name: Assemblage du site (CSP, précompression, LICENSES/)
        id: stage
        shell: bash
        env:
          NAME: ${{ steps.meta.outputs.name }}
          SOURCE_DATE_EPOCH: ${{ steps.meta.outputs.epoch }}
        run: |
          site="target/web/dist"
          [ -f "$site/index.html" ] || { echo "::error::$site/index.html absent"; exit 1; }
          # Les URL doivent rester relatives pour que le site marche sous n'importe quel préfixe.
          if grep -Eq '(src|href)="/[^/]' "$site/index.html"; then
            echo "::error::$site/index.html contient des URL absolues"
            exit 1
          fi
          stage="$RUNNER_TEMP/stage/$NAME"
          mkdir -p "$stage/LICENSES/fonts"
          cp -R "$site/." "$stage/"
          python3 -I .github/evora/gates.py csp "$stage/index.html" "$stage/csp-hashes.txt"
          node .github/evora/precompress.mjs "$stage"
          for f in LICENSE-MIT LICENSE-APACHE NOTICE ATTRIBUTION.md; do cp "$f" "$stage/LICENSES/"; done
          cp .github/evora/BASED-ON.txt "$stage/LICENSES/"
          cp assets/fonts/OFL-*.txt "$stage/LICENSES/fonts/"
          cp "$RUNNER_TEMP/licences/THIRD-PARTY-LICENSES.html" "$stage/LICENSES/"
          # Archive reproductible : ordre trié, dates fixées au commit, sans attributs étendus.
          out="$GITHUB_WORKSPACE/dist/evora"
          mkdir -p "$out"
          find "$stage" -exec touch -h -d "@$SOURCE_DATE_EPOCH" {} +
          (cd "$RUNNER_TEMP/stage" && find "$NAME" -type f | LC_ALL=C sort | zip -qX9 "$out/$NAME.zip" -@)
          cp "$stage/csp-hashes.txt" "$out/csp-hashes.txt"
          unzip -l "$out/$NAME.zip"
          echo "stage=$stage" >> "$GITHUB_OUTPUT"

      - name: Porte marques (bundle)
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        shell: bash
        run: python3 -I .github/evora/gates.py marks "${{ steps.stage.outputs.stage }}"

      - name: Porte hébergement (archive)
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        shell: bash
        run: python3 -I .github/evora/gates.py hosting "dist/evora/${{ steps.meta.outputs.name }}.zip"

      - name: Porte catalogues (émojis E10, termes sensibles E9)
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        shell: bash
        run: python3 -I .github/evora/gates.py catalogs . --emoji "$EVORA_EMOJI_GATE" --terms "$EVORA_TERMS_GATE"

      - name: Mesure de taille
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        shell: bash
        run: python3 -I .github/evora/gates.py sizes "${{ steps.stage.outputs.stage }}" "dist/evora/${{ steps.meta.outputs.name }}.zip"

      - name: Test de fumée (Chrome sans interface, autre origine)
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        shell: bash
        env:
          NAME: ${{ steps.meta.outputs.name }}
        run: |
          # Sur l'archive elle-même, extraite : c'est ce qui sera livré.
          x="$RUNNER_TEMP/extract"
          mkdir -p "$x"
          unzip -q "dist/evora/$NAME.zip" -d "$x"
          node --version
          google-chrome --version
          node .github/evora/smoke.mjs --site "$x/$NAME" --csp "$x/$NAME/csp-hashes.txt" --out "$RUNNER_TEMP/fumee" \
            --chrome google-chrome --emoji "$EVORA_EMOJI_GATE" --terms "$EVORA_TERMS_GATE" --lang-checks --ns-checks --theme-checks

      - name: Diagnostic du test de fumée
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostic-fumee-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fumee/
          retention-days: 14
          if-no-files-found: warn

      - name: SHA256SUMS
        shell: bash
        env:
          NAME: ${{ steps.meta.outputs.name }}
        run: |
          cd dist/evora
          sha256sum "$NAME.zip" csp-hashes.txt > SHA256SUMS
          cat SHA256SUMS
          { echo "### SHA256SUMS"; echo; echo '```'; cat SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Artefact (nom Evora, portes vertes)
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.meta.outputs.name }}
          path: |
            dist/evora/${{ steps.meta.outputs.name }}.zip
            dist/evora/SHA256SUMS
            dist/evora/csp-hashes.txt
          if-no-files-found: error

      - name: Empreinte de l'artefact
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          echo "::notice::artefact ${{ steps.meta.outputs.name }} id $ARTIFACT_ID, sha256:$ARTIFACT_DIGEST"
          echo "- Artefact \`${{ steps.meta.outputs.name }}\` : id $ARTIFACT_ID, empreinte sha256:$ARTIFACT_DIGEST ; commit \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"

  tests:
    name: Tests ciblés ui-egui (catalogues, liens)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain Rust (rustup)
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          rustc --version

      - name: Cache du registre cargo (lecture)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: evora-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            evora-cargo-${{ runner.os }}-

      - name: Catalogues et liens (tests unitaires d'ui-egui)
        shell: bash
        run: |
          # Exclu : test amont qui exige une police japonaise installée sur le système (Noto Sans
          # CJK JP) ou craft-fonts ; sans rapport avec les patchs Evora. À réactiver avec E6.
          cargo test --locked -p filmcraft-ui-egui --lib -- 'i18n::' 'links::' \
            --skip 'i18n::tests::language_commands_switch_and_persist_without_a_document'

      - name: Liens à l'écran (test d'interface sans GPU)
        shell: bash
        run: cargo test --locked -p filmcraft-ui-egui --test links_ui
