# cargo-about du build web Evora : licences tierces agrégées dans LICENSES/ de l'artefact.
# Même graphe que deny.toml (crate filmcraft-web, cible wasm32) ; ordre de préférence quand une
# crate offre un choix (« MIT OR Apache-2.0 » → MIT).
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
]
targets = ["wasm32-unknown-unknown"]
ignore-build-dependencies = true
ignore-dev-dependencies = true

[symphonia]
accepted = ["MPL-2.0"]
[symphonia-bundle-flac]
accepted = ["MPL-2.0"]
[symphonia-bundle-mp3]
accepted = ["MPL-2.0"]
[symphonia-codec-aac]
accepted = ["MPL-2.0"]
[symphonia-codec-alac]
accepted = ["MPL-2.0"]
[symphonia-codec-pcm]
accepted = ["MPL-2.0"]
[symphonia-codec-vorbis]
accepted = ["MPL-2.0"]
[symphonia-core]
accepted = ["MPL-2.0"]
[symphonia-format-isomp4]
accepted = ["MPL-2.0"]
[symphonia-format-ogg]
accepted = ["MPL-2.0"]
[symphonia-format-riff]
accepted = ["MPL-2.0"]
[symphonia-metadata]
accepted = ["MPL-2.0"]
[symphonia-utils-xiph]
accepted = ["MPL-2.0"]
[epaint_default_fonts]
accepted = ["OFL-1.1", "Ubuntu-font-1.0"]
